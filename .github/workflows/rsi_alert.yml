name: Hourly RSI Alert

on:
  schedule:
    # 매시 5분에 실행 (정각 요청이 몰리는 것을 피하기 위해 살짝 오프셋)
    - cron: '5 * * * *'
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼용

jobs:
  rsi-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 상태 파일(rsi_state.json)을 다시 커밋하기 위해 필요

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 여기 원하는 코인으로 수정하세요 (바이낸스 심볼 표기, 콤마로 구분)
          SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT"
        run: python rsi_alert.py

      - name: Commit updated RSI state
        run: |
          git config user.name "rsi-alert-bot"
          git config user.email "rsi-alert-bot@users.noreply.github.com"
          git add rsi_state.json
          git diff --staged --quiet || git commit -m "chore: update rsi state"
          git push
